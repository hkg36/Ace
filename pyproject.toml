[project]
name = "crew"
version = "0.1.0"
description = "Crew - 可独立部署的本地多智能体工作台"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Crew Contributors" },
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.46.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "websockets>=17.4",
    "psutil>=7.2.2",
    "apscheduler>=3.11.3",
    "mcp>=2.3.0,<3.0",
    "httpx>=0.28.1,<1.0",
    "requests>=2.34.2",
    "wcmatch>=12.0",
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
# MCP 已是核心依赖；该 extra 让 `.[mcp]` 安装形式继续有效。
mcp = [
    "mcp>=2.3.0,<3.0",
]
# 飞书/Lark 渠道（lark-oapi WebSocket 长连接）。未安装则 feishu 平台显示 unavailable。
feishu = [
    "lark-oapi==1.5.3",
]
# 微信（个人号 iLink Bot API 长轮询）渠道：aiohttp 收发 + cryptography 加密 CDN；
# qrcode 用于桌面端扫码登录的二维码渲染（SVG，无 pillow 依赖）。
# 未安装则 weixin 平台显示 unavailable。
weixin = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "qrcode>=8.2",
]
# Wiki 文件上传解析：HTML 需要 markdownify，PDF 需要 pymupdf，DOCX 需要 python-docx，
# XLSX 需要 openpyxl，PPTX 需要 python-pptx，文本编码探测需要 charset-normalizer。
# 旧版 DOC/XLS/PPT 在运行期通过系统 LibreOffice 转换，不额外引入 Python 包。
# 不加入核心依赖以避免基础包体积过大；完整 wiki 体验请安装 `.[wiki]`。
wiki = [
    "charset-normalizer>=3.5.2",
    "markdownify>=1.2.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "youtube-transcript-api>=1.2.5",
]
# PDF 处理 skill（crew/skills/pdf）：创建/处理 PDF + 视觉 QA。
# 创建：reportlab + matplotlib（图表）。
# 处理（提取/合并/填表/旋转）：pikepdf + pdfplumber。
# Markdown→PDF（swarm 报告）：markdown2 + xhtml2pdf（底层复用 reportlab）。
# 视觉 QA（SKILL.md 强制要求）：pypdfium2 + Pillow。
# 不加入核心依赖；按需安装 `.[pdf]`。
pdf = [
    "reportlab>=5.1.0",
    "matplotlib>=3.11.2",
    "pikepdf>=10.17.0",
    "pdfplumber>=0.11.10",
    "markdown2>=2.5.5",
    "xhtml2pdf>=0.2.28",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
]
# DOCX 处理 skill（crew/skills/docx）：创建/编辑/分析 .docx。
# Python 端：lxml + defusedxml（XML 解析/校验，脚本实际 import；SKILL.md 描述与代码不一致，以代码为准）。
# 创建新文档：依赖 Node.js 工具链（`node` + `npm install -g docx`），不在 pip 范围。
# 可选二进制：pandoc（文本提取/PDF 导出）、pdftoppm（PDF 转图片）。
# 不加入核心依赖；按需安装 `.[docx]`。
docx = [
    "lxml>=6.1.3",
    "defusedxml>=0.7.1",
]
# XLSX 处理 skill（crew/skills/xlsx）：创建/编辑/分析 .xlsx。
# Python 端：openpyxl（创建/编辑/公式）+ lxml + defusedxml（XML 校验）。
# pandas：SKILL.md 工作流强依赖（数据分析/读取/写入），纳入此 extra。
# 公式重算：依赖系统 LibreOffice（`soffice` 命令），不在 pip 范围。
# 不加入核心依赖；按需安装 `.[xlsx]`。
xlsx = [
    "openpyxl>=3.1.5",
    "lxml>=6.1.3",
    "defusedxml>=0.7.1",
    "pandas>=3.1.1",
]

[project.urls]
Homepage = "https://github.com/shuishenghualalala/Ace"
Repository = "https://github.com/shuishenghualalala/Ace"
Issues = "https://github.com/shuishenghualalala/Ace/issues"

[project.scripts]
crew = "crew.cli.main:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# e2e = 真实 LLM/网络的端到端测试，慢，默认跳过；`pytest -m e2e` 单独运行。
markers = [
    "e2e: end-to-end / real-LLM tests (slow); skipped by default, run with `pytest -m e2e`",
]
# 默认只跑快测试（跳过 e2e）；跑全量用 `pytest -m ""`，只跑 e2e 用 `pytest -m e2e`。
addopts = "-m 'not e2e'"

# ── ruff：最低限度的风格/静态门禁 ──────────────────────────────────────────
# 起步用 ruff 默认规则集（E4 / E7 / E9 / F：语法错误、未定义名、未用导入等高信号），
# 刻意不选 E5（行长）等噪音规则，避免 day-1 全线飘红让门禁形同虚设。
# 业务技能包（crew/skills）暂不强制；规则集待基线干净后增量收紧。
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["crew/skills"]

[tool.ruff.lint]
# 不显式 select 即为 ruff 默认集（E4/E7/E9/F）。后续可加 I / UP / B 等。
ignore = []

[dependency-groups]
dev = []
